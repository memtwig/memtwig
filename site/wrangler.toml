name = "memtwig-site"
main = "./worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "WAITLIST"
id = "0365b47d550e4ce8a3c45bb7806f6c5a"

[[routes]]
pattern = "memtwig.com"
custom_domain = true

[[routes]]
pattern = "www.memtwig.com"
custom_domain = true
