name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sync/publish (e.g. v1.4.3)"
        required: true
        type: string

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-homebrew-tap:
    needs: [goreleaser]
    if: always() && !cancelled() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Trigger immediate Homebrew tap sync if token configured
        run: |
          set -euo pipefail
          if [ -n "$TAP_TOKEN" ]; then
            GH_TOKEN="$TAP_TOKEN" gh workflow run update-formula.yml -R memtwig/homebrew-tap -f tag="$RELEASE_TAG"
            echo "Triggered immediate update-formula.yml for $RELEASE_TAG"
          else
            echo "HOMEBREW_TAP_TOKEN not set; memtwig/homebrew-tap scheduled sync picks up $RELEASE_TAG automatically"
          fi

  publish-mcp-registry:
    needs: [goreleaser]
    if: always() && !cancelled() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive"
          chmod +x mcp-publisher

      - name: Sync server.json version to release tag
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          python3 - <<'PY' "$VERSION"
          import json, pathlib, sys
          p = pathlib.Path("server.json")
          data = json.loads(p.read_text())
          if data.get("version") != sys.argv[1]:
              data["version"] = sys.argv[1]
              p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Login via GitHub OIDC and publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
