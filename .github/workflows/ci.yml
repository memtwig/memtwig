name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Cross-compile check
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/memtwig
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/memtwig
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/memtwig
